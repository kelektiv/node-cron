name: Release

on:
  push:
    branches:
      - main
      - beta
      - '+([0-9])?(.{+([0-9]),x}).x'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test

    runs-on: ubuntu-latest

    # using trusted publishing. see https://docs.npmjs.com/trusted-publishers
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Generate token
        id: get_workflow_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.NODE_CRON_RELEASE_APP_ID }}
          private-key: ${{ secrets.NODE_CRON_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.get_workflow_token.outputs.token }}

      - name: Fix stale pre-release tags
        run: |
          # If a pre-release tag points to a non-release commit (i.e. a previous
          # semantic-release run created the release commit and CHANGELOG/package.json
          # but failed before tagging it), force-move the tag to the most recent
          # matching "Release vX.Y.Z [skip ci]" commit already on this branch.
          # This lets semantic-release treat that version as released and produce the
          # next pre-release number (e.g. beta.2) on subsequent runs.
          for tag in $(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-'); do
            commit=$(git rev-parse "${tag}^{}" 2>/dev/null) || continue
            commit_msg=$(git log -1 --format='%s' "$commit")
            # A proper semantic-release commit includes "[skip ci]" in the subject
            if ! echo "$commit_msg" | grep -q '\[skip ci\]'; then
              version="${tag#v}"
              # Find the most recent "Release vVERSION [skip ci]" commit reachable from HEAD
              release_commit=$(git log --format='%H %s' HEAD | grep -m1 -E "^[0-9a-f]{40} Release v${version} \[skip ci\]" | awk '{print $1}')
              if [ -n "$release_commit" ]; then
                echo "Moving stale tag $tag from $commit to release commit $release_commit"
                git tag -f "$tag" "$release_commit"
                git push origin -f "$tag"
              else
                echo "No release commit found for $tag; leaving tag in place"
              fi
            fi
          done

      - name: Use Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Audit npm signatures
        run: npm audit signatures

      - name: Build project
        run: npm run build

      - name: Run Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          HUSKY: 0
